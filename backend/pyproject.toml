[project]
name = "nexus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2",
    "fastapi>=0.115", "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
gguf = ["llama-cpp-python>=0.3"]

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
