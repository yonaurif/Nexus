[project]
name = "nexus"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2",
    "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
gguf = ["llama-cpp-python>=0.3"]
embeddings = ["onnxruntime>=1.18", "tokenizers>=0.19", "numpy>=1.26"]
# Extracción de documentos + OCR (requiere el binario de Tesseract instalado aparte)
documents = ["pymupdf>=1.24", "pytesseract>=0.3.10", "pillow>=10", "python-docx>=1.1", "openpyxl>=3.1"]
# IA propia: clasificadores entrenados (Text Learning T1)
learning = ["scikit-learn>=1.5", "joblib>=1.4"]

[tool.setuptools.packages.find]
include = ["nexus*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
